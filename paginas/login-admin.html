<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Acesso | Nutri+ Suplementos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <h1>Nutri<span>+</span></h1>
            <p>Performance e Saúde de Verdade</p>
        </div>
        <div class="divIcones-header">
            <a href="login.html" class="icone-header">
                <i class="fa-solid fa-user"></i>
            </a>

            <a href="carrinho.html" class="icone-header">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="../index.html">Início</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="contatos.html">Contatos</a></li>
        </ul>
    </nav>


    <main class="container">
        <div class="container-forms" id="Login" style="display: block;">
            <h2>Área Administrativa</h2>
            <form id="form-login">
                <div class="div-form">
                    <label>E-mail:</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="div-form">
                    <label>Senha:</label>
                    <input type="password" id="login-senha" required>
                </div>
                    <button type="button" class="button-acesso" onclick="logar()">Entrar</button>
            </form>
        </div>
    </main>

    <script src="../js/admin.js"></script>
</body>
</html>
